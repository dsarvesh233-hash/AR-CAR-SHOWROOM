<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari AR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; font-family: sans-serif; }
        #ui-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; background: rgba(0, 0, 0, 0.6); padding: 15px 30px; border-radius: 12px; }
        button { padding: 12px 24px; border: 2px solid #fff; border-radius: 8px; background: transparent; color: white; cursor: pointer; }
        button:hover { background: #fff; color: #121212; }
        #loading-text { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; }
    </style>
</head>
<body>
    <div id="loading-text">Loading 3D Environment...</div>
    <div id="ui-container">
        <button onclick="playSound('idle')">Idle</button>
        <button onclick="playSound('accelerate')">Accelerate</button>
        <button onclick="playSound('flyby')">Flyby</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(ARButton.createButton(renderer));

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        const loader = new GLTFLoader();
        let carModel;
        loader.load('2020_ferrari_f8_tributo copy.glb', (gltf) => {
            document.getElementById('loading-text').innerText = "";
            carModel = gltf.scene;
            carModel.scale.setScalar(0.65);
            const box = new THREE.Box3().setFromObject(carModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDimension = Math.max(size.x, size.y, size.z);
            carModel.position.sub(center);
            scene.add(carModel);

            const distance = maxDimension / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.4;
            camera.position.set(distance * 0.8, distance * 0.45, distance);
            camera.near = Math.max(maxDimension / 1000, 0.01);
            camera.far = Math.max(maxDimension * 10, 100);
            camera.updateProjectionMatrix();
            controls.target.set(0, 0, 0);
            controls.update();
        }, undefined, () => {
            document.getElementById('loading-text').innerText = "Missing model file.";
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        renderer.xr.addEventListener('sessionstart', () => {
            if (carModel) carModel.position.set(0, 0, -2);
            document.getElementById('loading-text').innerText = 'AR Mode Active';
        });

        renderer.xr.addEventListener('sessionend', () => {
            if (carModel) carModel.position.set(0, 0, 0);
            document.getElementById('loading-text').innerText = '';
        });

        renderer.setAnimationLoop(() => {
            controls.update();
            renderer.render(scene, camera);
        });
    </script>
    <script>
        const audioSource = '18771__djbono__ferrari-f456.mp3'; 
        const carAudio = new Audio(audioSource);
        let currentInterval;
        const audioSegments = { idle: { start: 53.0, end: 58.0 }, accelerate: { start: 66.0, end: 73.0 }, flyby: { start: 21.0, end: 30.0 } };
        window.playSound = function(type) {
            clearInterval(currentInterval);
            const segment = audioSegments[type];
            carAudio.currentTime = segment.start; carAudio.play();
            currentInterval = setInterval(() => {
                if (carAudio.currentTime >= segment.end) { carAudio.pause(); clearInterval(currentInterval); }
            }, 100);
        };
    </script>
</body>
</html>
